name: Core tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      NVIM_LOG_FILE: ${{ github.workspace }}/nvim.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: folke/flash.nvim
          ref: 5f0f270fdc7c5b0c21d903ee85b9cb06f2ac636a
          path: .dev/flash.nvim
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.11.0
      - name: Use full temporary paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        # Neovim 0.11 globbing fails on 8.3 paths: neovim/neovim#25019.
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Build C core
        id: build
        run: nvim --clean -l lua/flash-any/compiler.lua
      - name: Test core without optional sources
        run: nvim --clean -l tests/run.lua
      - name: Test Flash integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          nvim --clean -l tests/flash.lua .dev/flash.nvim
          nvim --clean -l tests/char.lua .dev/flash.nvim
          nvim --clean -l tests/search.lua .dev/flash.nvim
          nvim --clean -l tests/search_repeat.lua .dev/flash.nvim
          nvim --clean -l tests/search_repeat.lua .dev/flash.nvim preserve
          nvim --clean -l tests/search_async.lua .dev/flash.nvim
          nvim --clean --headless -u tests/search_input.lua
          nvim --clean --headless -u tests/remote.lua
