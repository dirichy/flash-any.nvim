name: Setup demo tools
description: Install the pinned recording dependencies on Ubuntu
inputs:
  source-owner:
    description: Owner of the separately published flash-any source repositories
    default: ""
  neovim-version:
    description: Neovim release used for playback
    default: v0.11.0
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: folke/tokyonight.nvim
        ref: cdc07ac78467a233fd62c493de29a17e0cf2b2b6
        path: .demo-deps/tokyonight.nvim
    - uses: actions/checkout@v4
      with:
        repository: folke/flash.nvim
        ref: 5f0f270fdc7c5b0c21d903ee85b9cb06f2ac636a
        path: .demo-deps/flash.nvim
    - uses: actions/checkout@v4
      if: inputs.source-owner != ''
      with:
        repository: ${{ inputs.source-owner }}/flash-any-pinyin.nvim
        ref: main
        path: .dev/source-packages/flash-any-pinyin.nvim
        persist-credentials: false
    - uses: actions/checkout@v4
      if: inputs.source-owner != ''
      with:
        repository: ${{ inputs.source-owner }}/flash-any-tiger.nvim
        ref: main
        path: .dev/source-packages/flash-any-tiger.nvim
        persist-credentials: false
    - uses: actions/checkout@v4
      if: inputs.source-owner != ''
      with:
        repository: ${{ inputs.source-owner }}/flash-any-wubi86.nvim
        ref: main
        path: .dev/source-packages/flash-any-wubi86.nvim
        persist-credentials: false
    - uses: actions/checkout@v4
      if: inputs.source-owner != ''
      with:
        repository: ${{ inputs.source-owner }}/flash-any-nerdfont.nvim
        ref: main
        path: .dev/source-packages/flash-any-nerdfont.nvim
        persist-credentials: false
    - uses: actions/checkout@v4
      if: inputs.source-owner != ''
      with:
        repository: ${{ inputs.source-owner }}/flash-any-unicode.nvim
        ref: main
        path: .dev/source-packages/flash-any-unicode.nvim
        persist-credentials: false
    - uses: rhysd/action-setup-vim@v1
      with:
        neovim: true
        version: ${{ inputs.neovim-version }}
    - uses: charmbracelet/vhs-action@v2
      with:
        version: v0.12.1
    - name: Install and check Nerd Font
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        mkdir -p "$XDG_DATA_HOME/fonts" "$RUNNER_TEMP/demo-fonts"
        gh release download v3.4.0 --repo ryanoasis/nerd-fonts \
          --pattern JetBrainsMono.zip --dir "$RUNNER_TEMP/demo-fonts"
        unzip -j "$RUNNER_TEMP/demo-fonts/JetBrainsMono.zip" \
          JetBrainsMonoNerdFontMono-Regular.ttf JetBrainsMonoNerdFontMono-Bold.ttf \
          JetBrainsMonoNerdFontMono-Italic.ttf JetBrainsMonoNerdFontMono-BoldItalic.ttf \
          -d "$XDG_DATA_HOME/fonts"
        fc-cache -f
        fc-match -f 'Family: %{family}\nStyle: %{style}\nFile: %{file}\n' 'JetBrainsMono Nerd Font Mono'
        test "$(fc-match -f '%{family}' 'JetBrainsMono Nerd Font Mono' | cut -d, -f1)" = 'JetBrainsMono Nerd Font Mono'
    - name: Install and check CJK Font
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji

        fc-cache -f
        fc-match -f 'Family: %{family}\nStyle: %{style}\nFile: %{file}\n' 'Noto Sans CJK SC'

        test "$(fc-match -f '%{family}' 'Noto Sans CJK SC' | cut -d, -f1)" = 'Noto Sans CJK SC'
    - name: Install native build dependencies
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y build-essential
